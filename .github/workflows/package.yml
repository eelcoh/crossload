name: Package binaries

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake perl pkg-config python3
      - name: Check macOS build tools
        if: runner.os == 'macOS'
        run: |
          cmake --version
          perl --version
          c++ --version
          python3 --version
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.1
      - name: Check code
        run: mise run check
        env:
          CROSSLOAD_BUILD_BACKEND: native
      - name: TUI terminal smoke test
        run: python3 scripts/test-tui.py
      - name: Build binary and corresponding source archives
        run: mise run package
      - name: Keep packages and SHA-256 checksums
        uses: actions/upload-artifact@v4
        with:
          name: crossload-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  release:
    # Linux only: the macOS archives are unsigned, and a managed Mac cannot
    # clear their quarantine, so publishing them would offer what will not run.
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The changelog is the commits since the previous tag, so the release
          # needs history and tags rather than a single commit.
          fetch-depth: 0
      # Every platform's archives, so a release carries what was built and
      # tested rather than a third of it.
      - uses: actions/download-artifact@v4
        with:
          pattern: crossload-*
          merge-multiple: true
          path: dist
      - name: Publish the archives
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'NOTES'
          Crossload keeps your books in sync between a Kobo, your computer, and
          an XTeink X4 or another CrossPoint reader. See the
          [README](https://github.com/eelcoh/crossload#crossload) for what it
          does and how to use it.
          NOTES
          # GitHub's own generator lists merged pull requests, and this history
          # has none; the commits are the changelog.
          previous=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          {
            echo
            echo "## What changed"
            echo
            if [ -n "$previous" ]; then
              git log --no-merges --format='- %s' "$previous..$TAG"
              echo
              echo "**Full changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$previous...$TAG"
            else
              git log --no-merges --format='- %s' "$TAG"
            fi
          } >> notes.md
          cat >> notes.md <<'NOTES'

          ## Install on Linux (x86-64)

          ```sh
          sha256sum --ignore-missing -c crossload-VERSION-x86_64-unknown-linux-gnu.sha256
          tar -xzf crossload-VERSION-x86_64-unknown-linux-gnu.tar.gz
          install -m 755 crossload-VERSION-x86_64-unknown-linux-gnu/crossload ~/.local/bin/crossload
          crossload --version
          ```

          The binary needs no Rust, Python, Calibre or separately installed ebook
          libraries; it uses the system C/C++ runtime. `BUILD.json` in the archive
          records the compiler, platform and source revision.

          ## Install on macOS (Apple Silicon; use x86_64-apple-darwin on Intel)

          ```sh
          NAME=crossload-VERSION-aarch64-apple-darwin
          curl -fLO https://github.com/OWNER/releases/download/vVERSION/$NAME.tar.gz
          curl -fLO https://github.com/OWNER/releases/download/vVERSION/$NAME.sha256
          shasum -a 256 --ignore-missing -c $NAME.sha256
          tar -xzf $NAME.tar.gz
          install -m 755 $NAME/crossload ~/.local/bin/crossload
          crossload --version
          ```

          Fetch it with `curl` rather than a browser. macOS quarantines what a
          browser downloads, not what curl does, so a curl-fetched binary runs
          without being signed or notarized — which is how Homebrew's own
          bottles work. A browser-downloaded archive needs the quarantine
          cleared, and a managed Mac may forbid that.

          These archives build and pass their tests on every change, and a
          packaged binary has been run on a Mac. `cargo install --path .
          --locked` builds from source if you would rather.

          The source archive below builds offline and carries every dependency.
          NOTES
          sed -i "s/VERSION/${TAG#v}/g; s|OWNER|$GITHUB_REPOSITORY|g" notes.md
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Crossload ${TAG#v}" \
            --notes-file notes.md
