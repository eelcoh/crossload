name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check native build tools
        run: |
          cmake --version
          perl --version
          c++ --version
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.1
      - name: Check and build
        run: mise run check
        env:
          CROSSLOAD_BUILD_BACKEND: native
      - name: TUI terminal smoke test
        run: python3 scripts/test-tui.py
