[api.net]
include = [
    "cap-primitives::net",
    "cap-std::net",
    "mio::net",
]
# landlock's own `net` module describes rules for the kernel; it opens
# nothing (as in ambit's cackle.toml).
no_auto_detect = ["landlock"]

[api.fs]
include = [
    "cap-primitives::fs",
    "cap-std::fs",
    "rustix::fs",
]
# A path is a name, not access: building, joining or printing one needs no permission. The path
# functions that do reach the disk are their own API, `path_fs`, below.
exclude = [
    "std::path",
]
# landlock's own `fs` module describes rules for the kernel; the paths it
# opens to name them show up as `fs` uses of landlock (granted above).
no_auto_detect = ["landlock"]

# Asking the disk about a path, through std::path (exists, metadata, listing a folder, following
# links). Separate from fs only because cackle can't re-include these under the exclude above.
[api.path_fs]
include = [
    "std::path::Path::exists",
    "std::path::Path::try_exists",
    "std::path::Path::is_file",
    "std::path::Path::is_dir",
    "std::path::Path::is_symlink",
    "std::path::Path::metadata",
    "std::path::Path::symlink_metadata",
    "std::path::Path::canonicalize",
    "std::path::Path::read_link",
    "std::path::Path::read_dir",
    "std::path::absolute",
]

[api.process]
include = [
    "rustix::process",
]

