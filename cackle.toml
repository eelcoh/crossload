# Draft: uses unsafe (reported by cargo acl).
allow_unsafe = true

[pkg.zopfli]
# Draft: uses unsafe (reported by cargo acl).
allow_unsafe = true

[pkg.zune-jpeg]
# Draft: uses unsafe (reported by cargo acl).
allow_unsafe = true

[api.env]
# Draft, flagged for review (ADOPTING warns against no_auto_detect): tempfile has a public module
# called `env` (its default temp dir), which cackle would otherwise take for the env API. This
# only stops that name match; tempfile's own std::env calls are still found, and are granted to
# it above. tempfile is used by the human-owned caps/*-native crates and by tests, not the app.
no_auto_detect = ["tempfile"]
