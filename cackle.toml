# Reviewed and approved by the owner on 2026-10-12; the changes from moving the command line into
# the app (ambit 14a65c8) approved on 2026-10-13; ambit 3398b1e and the lock on 2026-10-18.
# Removed on 2026-10-13, because cackle fails on them: clap_derive, anstream, anstyle-parse,
# anstyle-query, anstyle-wincon and utf8parse (no longer built: no derive, no colour), and
# clap_builder's grants (env and terminate, no longer used). Two parts:
# - Copied from ambit's cackle.toml at 300f401: reviewed there for ambit's crates and their
#   dependencies. Entries for crates crossload doesn't build, and grants nothing here uses, were
#   removed (cackle fails on both). Where crossload needs more of one of these crates, the
#   addition is marked "crossload:".
# - The "CROSSLOAD" section at the end: what `cargo acl` reported for this workspace, granted only
#   to the crates it named, each with a one-line reason.
#   Most `allow_unsafe` and build-script grants were drafted from the crates' sources and then
#   confirmed by `cargo acl`, which fails on any grant that isn't used.
#
# Level 2 enforcement: which crate may use which API, checked by cackle (`cargo acl`) on the
# compiled code of every crate, dependencies included. Human-owned.
#
# - Apps (under apps/) get no [pkg.*] entry: no restricted API, and no opting out of memory safety.
#   Their effects go through the capabilities handed to init().
# - Build scripts and tests run in a Bubblewrap sandbox.

