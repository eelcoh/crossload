# Copied from ambit's cackle.toml at 3398b1e.
# Lockdown (ambit-lockdown): locks the program on Linux. Not in the app: the wiring applies it,
# and the native capabilities say what they need. landlock and seccompiler make the system calls
# (unsafe); landlock opens the granted paths to name them to the kernel (fs); ambit-lockdown
# makes a folder before locking (fs) and reads which machine it runs on (env::consts, no
# environment).
